# 배포용 설정. docker-compose.yml 위에 덮어 쓴다(통째로 복사해 두면 환경 변수 목록이 어긋난다)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 절차는 docs/deploy-aws.md

services:

  db:
    ports:
      # 서버 안에서만 열린다. 밖에서는 SSH 터널로 들어온다(docs/deploy-aws.md 6장). 인터넷에는 열지 않는다
      - "127.0.0.1:5432:5432"

  backend:
    # 어느 브랜치로 만든 이미지를 띄울지는 태그로 고른다(.env의 IMAGE_TAG).
    # 서버에서는 빌드하지 않는다. 이미지가 없을 때 서버에 받아 둔 소스로 조용히 빌드해 다른 코드를 띄우는 일을 막는다
    image: blackbox-backend:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 브라우저가 접속하는 주소(예: https://blackbox.example.com). 비어 있으면 뜨지 않는다.
      # 이 주소가 아닌 출처에서 온 요청은 403이 된다
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?.env의 APP_CORS_ORIGINS에 접속 주소를 적는다}
      # AI 에이전트를 Bedrock으로 쓸 때(SPRING_AI_MODEL_CHAT=bedrock-converse)의 리전과 모델.
      # 자격 증명은 EC2 인스턴스 프로필에서 받으므로 키를 적지 않는다
      SPRING_AI_BEDROCK_AWS_REGION: ${BEDROCK_REGION:-us-east-1}
      SPRING_AI_BEDROCK_CONVERSE_CHAT_OPTIONS_MODEL: ${BEDROCK_MODEL:-}

  frontend:
    image: blackbox-frontend:${IMAGE_TAG:-latest}
    build: !reset null

  nginx:
    image: blackbox-nginx:${IMAGE_TAG:-latest}
    build: !reset null
    volumes:
      # 같은 자리(/etc/nginx/nginx.conf)라 개발용 설정을 대신한다
      - ./nginx/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      # server.crt, server.key. 만드는 법은 docs/deploy-aws.md
      - ./ssl:/etc/nginx/ssl:ro
