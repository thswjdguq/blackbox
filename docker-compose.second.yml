# 같은 PC에 한 벌을 더 띄울 때 붙이는 설정. 예: 지금 폴더는 main으로 개발하고, 옆 폴더에서 시연 브랜치를 확인한다
#
#   git worktree add ../blackbox-expo origin/shinguexpo     # 브랜치를 옆 폴더에 받는다(지금 폴더의 브랜치는 그대로)
#   cd ../blackbox-expo && cp ../blackbox/.env .
#   docker compose -f docker-compose.yml -f ../blackbox/docker-compose.second.yml up -d --build
#   → https://localhost:8443
#
# 폴더 이름이 Compose의 프로젝트 이름이 되어 이미지, DB 볼륨, 업로드 볼륨, 네트워크가 그 이름으로 따로 만들어진다.
# docker-compose.yml에 고정돼 있어 겹치는 것은 컨테이너 이름과 포트뿐이라 이 파일은 그 둘만 바꾼다.
# 폴더를 나누지 않고 한 폴더에서 브랜치만 바꿔 띄우면 이미지와 DB가 섞인다(README 6장)

services:

  db:
    container_name: ${COMPOSE_PROJECT_NAME}_db

  backend:
    container_name: ${COMPOSE_PROJECT_NAME}_backend

  frontend:
    container_name: ${COMPOSE_PROJECT_NAME}_frontend

  nginx:
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    ports: !override
      - "127.0.0.1:${SECOND_HTTP_PORT:-8081}:80"
      - "127.0.0.1:${SECOND_HTTPS_PORT:-8443}:443"
