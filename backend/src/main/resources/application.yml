spring:
  datasource:
    # docker-compose.yml에서 SPRING_DATASOURCE_* 환경변수로 직접 주입됨
    # 로컬 개발(application-local.yml)에서는 localhost:5432 사용
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blackbox_db}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # dialect는 정하지 않는다. Hibernate가 연결한 DB(PostgreSQL)를 보고 고르며, 정하면 폐기 예정 경고(HHH90000025)를 낸다
        format_sql: true
        type:
          # JSON 칸(jsonb)을 Jackson 3으로 읽고 쓴다. Hibernate는 Jackson 2가 있으면 그쪽을 먼저 고르는데, Jackson 2는
          # jjwt와 OpenAI SDK가 안에서 쓰느라 빠지지 않는다. 그대로 두면 Jackson 3의 JsonNode 칸을 읽지 못한다
          json_format_mapper: jackson3

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    # Spring Boot 4부터 JSON은 Jackson 3으로 처리한다. 3의 기본값 일부(필드를 이름순으로 정렬, 원시 타입 칸의 null 거부 등)가
    # 2와 달라 API 응답과 요청 해석이 바뀔 수 있으므로 Boot가 Jackson 2에 쓰던 기본값을 그대로 쓴다
    use-jackson2-defaults: true

  # ── AI 에이전트(K-30)의 모델 ──────────────────────────────────────────
  # 공급자와 모델에 닿는 설정은 여기(spring.ai)에, 에이전트가 스스로 지키는 상한은 아래 app.agent에 둔다.
  # 값을 바꿀 때는 환경 변수로 준다(.env.example 참고). 키는 이 파일에 적지 않는다
  ai:
    model:
      # 공급자. none이면 키가 없어도 서버가 뜨고 에이전트만 꺼진다
      #   google-genai      + SPRING_AI_GOOGLE_GENAI_API_KEY
      #   bedrock-converse  + SPRING_AI_BEDROCK_AWS_REGION 과 AWS 자격 증명
      #   openai            + SPRING_AI_OPENAI_API_KEY, SPRING_AI_OPENAI_CHAT_MODEL.
      #                       OpenAI 호환 게이트웨이에 붙을 때는 SPRING_AI_OPENAI_BASE_URL도 준다(Spring AI 2.0부터 끝에 /v1까지)
      chat: none
      # 쓰지 않는 종류다. OpenAI 스타터는 이 종류들의 빈도 기본으로 만들고 그때 키가 없으면 서버가 뜨지 않는다
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    google:
      genai:
        chat:
          # 쓰지 않는 기능이고, 켜 두면 Spring AI가 이 기능의 조건을 따지다가 모델 빈을 설정이 읽히기도 전에 만든다.
          # 그러면 그 빈이 쓰는 우리 설정(app.agent)이 빈 채로 굳는다. 끄면 모델 빈이 제때 만들어진다
          enable-cached-content: false
          # Spring AI가 기본으로 쓰는 모델은 폐기돼 404가 나므로 반드시 정한다.
          # 무료 등급에서 Flash-Lite는 하루 500번, Flash는 하루 20번이다(2026-10 기준, docs/team/tasks/A-30.md)
          model: gemini-3.5-flash-lite
          # temperature와 thinking-level은 정하지 않는다. Gemini 3 계열은 temperature를 기본값(1.0)에서
          # 낮추면 답이 나빠질 수 있다고 Google이 안내하고, Flash-Lite의 생각 수준은 기본이 가장 낮다
    openai:
      # Spring AI 2.0부터 OpenAI 공급자는 OpenAI의 Java SDK로 부른다. 시간 제한과 다시 보내는 횟수도 SDK에 준다.
      # 정하지 않으면 응답 없는 요청이 실행 스레드를 오래 잡는다
      timeout: ${app.agent.model-request-timeout}
      max-retries: 1   # 처음 요청을 뺀 횟수. app.agent.model-request-attempts(2)와 맞춘다
      chat:
        # 2.0부터 Spring AI가 기본으로 넣던 0.7이 없어졌다. 1.x 때와 같은 답을 내도록 그대로 준다
        temperature: 0.7
    bedrock:
      aws:
        timeout: ${app.agent.model-request-timeout}   # 호출 하나의 전체 시간 제한
    retry:
      # Spring AI의 기본은 10번, 2초부터 5배씩이라 한 번의 실패가 몇 분을 끈다. 실행의 시간 상한 안에 들어오게 줄인다
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

app:
  cors:
    origins: ${APP_CORS_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}                    # access token 30분
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # refresh token 7일
  file:
    upload-dir: ${FILE_UPLOAD_DIR:/data/uploads}
  frontend-base-url: ${FRONTEND_BASE_URL:}       # 10분 전 알림 URL 생성용 (예: https://yourdomain.com)
  agent:
    zone: Asia/Seoul        # "오늘"과 "늦음"을 판단하는 시간대
    tool-list-limit: 100    # 도구가 한 번에 돌려주는 목록의 건수. 넘으면 잘렸다고 알린다
    proposal-list-limit: 50 # 제안 카드 목록이 돌려주는 건수. 최신이 먼저다
    # 실행 하나의 시간 상한. 넘긴 실행은 끝난 것으로 본다.
    # 이벤트 사이가 이만큼 조용할 수 있으므로 nginx의 proxy_read_timeout(nginx/*.conf)이 이보다 길어야 한다
    run-time-limit: 120s
    model-request-timeout: 60s   # 모델에 보내는 요청 하나의 시간 제한. 없으면 응답이 없는 요청이 스레드를 끝없이 잡는다
    model-request-attempts: 2    # 요청 하나를 몇 번까지 보내는가(처음 포함). 일시적인 실패(503 등)만 다시 보낸다
    max-tool-calls: 12      # 실행 하나에서 모델이 도구를 부를 수 있는 횟수. 넘으면 조회한 것으로 답하게 한다
    runs-per-hour: 30       # 프로젝트 하나가 한 시간에 실행할 수 있는 횟수
    # 서버 전체에서 동시에 도는 실행의 수. 모델이 멈춰도 다른 기능의 스레드를 쓰지 않게 따로 둔다.
    # 실행 하나가 요청을 2~3번 보내므로 4면 분당 12번 안쪽이다(Flash-Lite 무료 등급의 분당 한도는 15번)
    max-concurrent-runs: 4
    brief-max-length: 20000 # 과제 안내문의 글자 수 상한
    question-max-length: 1000

external:
  github:
    app-id: ${GITHUB_APP_ID:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    base-url: https://api.github.com
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost/api/auth/google/callback}
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: claude-sonnet-4-6
    base-url: https://api.anthropic.com
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    base-url: https://api.openai.com
  notion:
    api-key: ${NOTION_API_KEY:}
    parent-page-id: ${NOTION_PARENT_PAGE_ID:}
    calendar-db-id: ${NOTION_CALENDAR_DB_ID:}   # Notion 캘린더 데이터베이스 ID (선택)
    base-url: https://api.notion.com
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}         # 글로벌 폴백용 (현재 미사용, per-project DB에서 관리)
