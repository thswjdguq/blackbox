spring:
  datasource:
    # docker-compose.yml에서 SPRING_DATASOURCE_* 환경변수로 직접 주입됨
    # 로컬 개발(application-local.yml)에서는 localhost:5432 사용
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blackbox_db}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # AI 에이전트(K-30)의 모델 공급자. 기본은 none이라 키가 없어도 서버가 뜨고 에이전트만 꺼진다.
  # 켤 때는 환경 변수로 준다. 키와 모델 이름도 환경 변수이고 이 파일에는 적지 않는다(.env.example 참고)
  #   SPRING_AI_MODEL_CHAT=google-genai      + SPRING_AI_GOOGLE_GENAI_API_KEY
  #   SPRING_AI_MODEL_CHAT=bedrock-converse  + SPRING_AI_BEDROCK_AWS_REGION 과 AWS 자격 증명
  ai:
    model:
      chat: none
    google:
      genai:
        chat:
          options:
            # Spring AI 1.1.8의 기본 모델은 폐기돼 404가 난다. 바꾸려면 SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL
            model: gemini-3.5-flash

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

app:
  cors:
    origins: ${APP_CORS_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}                    # access token 30분
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # refresh token 7일
  file:
    upload-dir: ${FILE_UPLOAD_DIR:/data/uploads}
  frontend-base-url: ${FRONTEND_BASE_URL:}       # 10분 전 알림 URL 생성용 (예: https://yourdomain.com)
  agent:
    zone: Asia/Seoul        # "오늘"과 "늦음"을 판단하는 시간대
    tool-list-limit: 100    # 도구가 한 번에 돌려주는 목록의 건수. 넘으면 잘렸다고 알린다
    proposal-list-limit: 50 # 제안 카드 목록이 돌려주는 건수. 최신이 먼저다
    run-time-limit: 120s    # 실행 하나의 시간 상한. 넘긴 실행은 끝난 것으로 본다
    runs-per-hour: 30       # 프로젝트 하나가 한 시간에 실행할 수 있는 횟수
    max-concurrent-runs: 4  # 서버 전체에서 동시에 도는 실행의 수. 모델이 멈춰도 다른 기능의 스레드를 쓰지 않게 따로 둔다
    brief-max-length: 20000 # 과제 안내문의 글자 수 상한
    question-max-length: 1000

external:
  github:
    app-id: ${GITHUB_APP_ID:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    base-url: https://api.github.com
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost/api/auth/google/callback}
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: claude-sonnet-4-6
    base-url: https://api.anthropic.com
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    base-url: https://api.openai.com
  notion:
    api-key: ${NOTION_API_KEY:}
    parent-page-id: ${NOTION_PARENT_PAGE_ID:}
    calendar-db-id: ${NOTION_CALENDAR_DB_ID:}   # Notion 캘린더 데이터베이스 ID (선택)
    base-url: https://api.notion.com
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}         # 글로벌 폴백용 (현재 미사용, per-project DB에서 관리)
