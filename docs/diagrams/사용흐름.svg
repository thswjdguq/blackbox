<text font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="4" y="378.2">요구사항 충족 확인은 검토와 별개로 언제든 할 수 있다. 확정 조건: 필수 요구사항 충족, 최신 회차 승인, 미해결 피드백 0건.</tspan></text></svg>
