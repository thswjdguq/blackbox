# main이 바뀌면 열린 PR 브랜치에 최신 main을 병합한다.
# main 보호 규칙이 "최신 상태 요구"라, PR 하나가 병합될 때마다 나머지 PR을 손으로 갱신하던 일을 대신한다.
# 갱신만 하고 병합은 하지 않는다. 충돌이 나는 PR은 건너뛰고 작성자가 직접 해결한다.
# 이미지 빌드(images.yml)와 분리했다. 배포가 실패해도 PR 갱신은 되고, 그 반대도 같다.
#
# 갱신은 개인 액세스 토큰(Secret PR_UPDATE_TOKEN, 이 저장소의 Contents·Pull requests 쓰기만 가진 fine-grained 토큰)으로 한다.
# GITHUB_TOKEN으로 최신화하면 그 push로 시작된 CI가 "Approve workflows to run" 승인을 기다려 필수 상태 검사가 채워지지 않는다(#230 후속).
# push가 봇이 아닌 토큰 소유자의 것으로 기록되어 CI(pull_request)가 승인 없이 바로 실행된다
name: PR 브랜치 최신화

on:
  push:
    branches: [main]
  # 실패한 실행을 손으로 다시 돌릴 때. 남은 PR만 이어서 처리한다. 아래 job은 main에서 고른 실행만 돈다
  workflow_dispatch:

# GITHUB_TOKEN은 checkout에만 쓴다. 갱신은 PR_UPDATE_TOKEN이 한다
permissions:
  contents: read

# 연달아 병합되면 앞 실행을 취소하고 마지막 main 기준으로 한 번만 갱신한다
concurrency:
  group: update-pr-branches
  cancel-in-progress: true

jobs:
  update:
    # 수동 실행은 브랜치를 고를 수 있다. 다른 브랜치의 스크립트가 Secret을 받지 않도록 main에서만 돈다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 실행하는 스크립트는 main의 것이다. PR 브랜치의 코드는 내려받지도 실행하지도 않는다
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # 처리 규칙은 스크립트 주석에 있다. mock gh로 하는 회귀 검사: scripts/test-update-pr-branches.sh
      - name: main보다 뒤처진 PR 브랜치 갱신
        env:
          GH_TOKEN: ${{ secrets.PR_UPDATE_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash scripts/update-pr-branches.sh
