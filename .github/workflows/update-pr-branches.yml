# main이 바뀌면 열린 PR 브랜치에 최신 main을 병합하고 필수 검사(CI)를 다시 돌린다.
# main 보호 규칙이 "최신 상태 요구"라, PR 하나가 병합될 때마다 나머지 PR을 손으로 갱신하던 일을 대신한다.
# 갱신만 하고 병합은 하지 않는다. 충돌이 나는 PR은 건너뛰고 작성자가 직접 해결한다.
# 이미지 빌드(images.yml)와 분리했다. 배포가 실패해도 PR 갱신은 되고, 그 반대도 같다.
name: PR 브랜치 최신화

on:
  push:
    branches: [main]
  # 실패한 실행(CI 요청 실패, 갱신 대기 초과)을 손으로 다시 돌릴 때. 스크립트가 남은 PR만 이어서 처리한다
  workflow_dispatch:

permissions:
  contents: write        # PR 브랜치에 main 병합 커밋을 만든다
  pull-requests: write   # update-branch API
  actions: write         # 갱신한 브랜치에서 CI를 실행한다

# 연달아 병합되면 앞 실행을 취소하고 마지막 main 기준으로 한 번만 갱신한다
concurrency:
  group: update-pr-branches
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 처리 규칙과 실패 시 복구는 스크립트 주석에 있다. 가짜 gh로 하는 회귀 검사: scripts/test-update-pr-branches.sh
      - name: main보다 뒤처진 PR 브랜치 갱신과 CI 실행
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/update-pr-branches.sh
