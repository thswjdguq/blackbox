# main이 바뀌면 열린 PR 브랜치에 최신 main을 병합하고 필수 검사(CI)를 다시 돌린다.
# main 보호 규칙이 "최신 상태 요구"라, PR 하나가 병합될 때마다 나머지 PR을 손으로 갱신하던 일을 대신한다.
# 갱신만 하고 병합은 하지 않는다. 충돌이 나는 PR은 건너뛰고 작성자가 직접 해결한다.
# 이미지 빌드(images.yml)와 분리했다. 배포가 실패해도 PR 갱신은 되고, 그 반대도 같다.
name: PR 브랜치 최신화

on:
  push:
    branches: [main]

permissions:
  contents: write        # PR 브랜치에 main 병합 커밋을 만든다
  pull-requests: write   # update-branch API
  actions: write         # 갱신한 브랜치에서 CI를 실행한다

# 연달아 병합되면 앞 실행을 취소하고 마지막 main 기준으로 한 번만 갱신한다
concurrency:
  group: update-pr-branches
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: main보다 뒤처진 PR 브랜치 갱신과 CI 실행
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Draft는 아직 병합할 PR이 아니라서 갱신하지 않는다(작성자의 로컬 브랜치와 자주 어긋나지 않게).
          # 다른 저장소(fork)의 브랜치에는 쓸 수 없으므로 뺀다
          gh pr list -R "$REPO" --base main --state open --limit 100 \
              --json number,headRefName,isDraft,isCrossRepository \
              -q '.[] | select((.isDraft | not) and (.isCrossRepository | not)) | "\(.number) \(.headRefName)"' |
          while read -r n ref; do
            before=$(gh api "repos/$REPO/pulls/$n" -q .head.sha) || continue
            # expected_head_sha: 그사이 작성자가 push했으면 갱신하지 않는다. 이미 최신이거나 충돌이면 422로 거절된다
            if ! gh api -X PUT "repos/$REPO/pulls/$n/update-branch" -f expected_head_sha="$before" --silent 2> err; then
              echo "#$n 갱신하지 않음: $(head -c 200 err)"
              continue
            fi
            # update-branch는 비동기라, 병합 커밋이 브랜치에 생길 때까지 기다린 뒤 CI를 돌린다
            for _ in $(seq 1 30); do
              now=$(gh api "repos/$REPO/pulls/$n" -q .head.sha)
              [ "$now" != "$before" ] && break
              sleep 2
            done
            if [ "$now" = "$before" ]; then
              echo "#$n 갱신 요청은 됐지만 60초 안에 브랜치가 바뀌지 않아 CI를 실행하지 않음"
              continue
            fi
            # GITHUB_TOKEN으로 만든 push는 pull_request 실행을 만들지 않으므로 CI를 직접 부른다.
            # 같은 커밋에 같은 이름의 검사가 붙어 main 보호 규칙의 필수 검사를 채운다
            gh workflow run ci.yml -R "$REPO" --ref "$ref"
            echo "#$n 갱신(${before:0:8} → ${now:0:8}), CI 실행"
          done
