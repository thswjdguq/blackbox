# PR 검사 — 모든 PR과 main 푸시에서 실행한다.
# 이 워크플로의 job 이름이 GitHub 브랜치 보호의 "필수 검사" 이름이 된다(A-01).
name: CI

on:
  # base가 main이 아닌 PR(앞 PR 위에 쌓은 PR)도 리뷰 때 검사 결과가 붙게 base를 가리지 않는다
  pull_request:
  push:
    branches: [main]
  # main이 바뀌어 PR 브랜치를 자동으로 갱신한 뒤 update-pr-branches.yml이 부른다.
  # GITHUB_TOKEN으로 만든 push는 pull_request 실행을 만들지 않으므로, 필수 검사를 이 방법으로 다시 돌린다
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Java 25 · PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blackbox_test
          POSTGRES_USER: blackbox_test
          POSTGRES_PASSWORD: blackbox_test   # CI 전용 더미. 운영 비밀값이 아니다.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackbox_test -d blackbox_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # 메일 테스트 수신함(K-41 11장). 확인 메일을 실제 SMTP로 받아 확인 API까지 가는 테스트가 쓴다.
      # docker-compose.test-db.yml의 mail-test와 같은 이미지·포트다
      mailpit:
        image: axllent/mailpit:v1.27.4@sha256:df6c2541907e1be6fac21f509927cf6ed771617a1f4b361ef66d97bd05593d2d
        env:
          MP_DISABLE_VERSION_CHECK: "true"
        ports:
          - 28125:1025
          - 28025:8025
    env:
      # 실제 DB를 붙여야 BlackboxApplicationTests가 Flyway 적용과 ddl-auto=validate 검사를 제대로 한다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/blackbox_test
      SPRING_DATASOURCE_USERNAME: blackbox_test
      SPRING_DATASOURCE_PASSWORD: blackbox_test
      JWT_SECRET: ci-only-dummy-signing-key-not-a-real-secret-0123456789
      JAVA_TOOL_OPTIONS: -Dspring.test.context.cache.maxSize=3
      BB_MAIL_TEST_API: http://127.0.0.1:28025   # 있을 때만 EmailVerificationMailpitTest가 돈다
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: 서버 스크립트 검사(S3 백업)
        run: bash scripts/test-ec2-backup-s3.sh

      - name: 워크플로 스크립트 검사(PR 브랜치 최신화)
        run: bash scripts/test-update-pr-branches.sh

      - name: 빌드 + 테스트
        working-directory: backend
        run: ./gradlew --no-daemon --console=plain build

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    name: DB 마이그레이션 (깨끗한 DB + 기존 데이터 업그레이드)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blackbox_test
          POSTGRES_USER: blackbox_test
          POSTGRES_PASSWORD: blackbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackbox_test -d blackbox_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BB_SKIP_COMPOSE: '1'          # CI는 위 service 컨테이너를 그대로 쓴다
      BB_TEST_DB_PORT: '5432'
      JWT_SECRET: ci-only-dummy-signing-key-not-a-real-secret-0123456789
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: 마이그레이션 검증
        timeout-minutes: 15
        run: bash scripts/verify-db.sh

  frontend:
    name: frontend (Node 26 · 타입체크 + 빌드)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 26 준비
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 기존 main 마이그레이션 보존 검사
        run: node scripts/verify-main-migration-history.cjs

      - name: 타입 검사
        working-directory: frontend
        run: npm run type-check

      - name: 빌드
        working-directory: frontend
        run: npm run build
