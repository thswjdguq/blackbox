services:
  db:
    container_name: newteamplay_db
  backend:
    container_name: newteamplay_backend
    environment:
      FRONTEND_BASE_URL: https://127.0.0.1:8443
      GOOGLE_REDIRECT_URI: https://127.0.0.1:8443/api/auth/google/callback
      NOTION_API_KEY: ""
      NOTION_PARENT_PAGE_ID: ""
      NOTION_CALENDAR_DB_ID: ""
      DISCORD_WEBHOOK_URL: ""
  frontend:
    container_name: newteamplay_frontend
    environment:
      NEXT_PUBLIC_API_URL: https://127.0.0.1:8443/api
  nginx:
    container_name: newteamplay_nginx
    ports: !override
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./.local-run/nginx.conf:/etc/nginx/nginx.conf:ro