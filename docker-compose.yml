# 컨테이너 이름과 포트(80, 443)가 고정이라 한 PC에 이 파일만으로 두 벌을 띄울 수 없다.
# 다른 브랜치를 함께 띄울 때는 옆 폴더에 받아 docker-compose.second.yml을 붙인다(README 6장).
# 배포할 때는 docker-compose.prod.yml을 붙인다(docs/deploy-aws.md)
services:

  # ─────────────────────────────────────────
  # 1. DATABASE
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: blackbox_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - blackbox_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # 2. BACKEND (Spring Boot — 로컬 빌드)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackbox_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-1800000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      FILE_UPLOAD_DIR: /data/uploads
      SPRING_PROFILES_ACTIVE: local
      # CORS — 브라우저 origin 허용 목록 (local 프로파일에서 "*" 로 덮어씀)
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-*}
      # 확장 기능 API 키
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # AI 에이전트(K-30). 기본은 none이라 키가 없으면 에이전트만 꺼진다
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      SPRING_AI_GOOGLE_GENAI_API_KEY: ${GEMINI_API_KEY:-}
      SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # OpenAI 호환 API. 주소를 바꾸면 게이트웨이에 붙는다(끝에 /v1 없이). 회의록 요약과 에이전트(SPRING_AI_MODEL_CHAT=openai)가
      # 같은 키(OPENAI_API_KEY), 주소, 모델을 쓴다. 적지 않으면 application.yml의 기본값과 같다
      EXTERNAL_OPENAI_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com}
      EXTERNAL_OPENAI_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      SPRING_AI_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPRING_AI_OPENAI_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      NOTION_PARENT_PAGE_ID: ${NOTION_PARENT_PAGE_ID:-}
      NOTION_CALENDAR_DB_ID: ${NOTION_CALENDAR_DB_ID:-}
      # application.yml 참조 — 설정 보완 (Task 29)
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/api/auth/google/callback}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - uploads:/data/uploads
    networks:
      - blackbox_net
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────
  # 3. FRONTEND (Next.js — 로컬 빌드)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blackbox_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost/api}
    networks:
      - blackbox_net
    depends_on:
      - backend

  # ─────────────────────────────────────────
  # 4. NGINX (리버스 프록시 + SSL)
  # ─────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: blackbox_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - blackbox_net
    depends_on:
      - frontend
      - backend

# ─────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  uploads:
    driver: local

# ─────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────
networks:
  blackbox_net:
    driver: bridge
